spring.application.name=backend
spring.datasource.url=jdbc:postgresql://localhost:5432/ims_db
spring.datasource.username=postgres
spring.datasource.password=mysecretpassword
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Allow the Vite dev server (and any extra origins) to call the API.
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# Omit null fields from JSON responses (relaxed binding to JsonInclude.Include).
spring.jackson.default-property-inclusion=non_null

# NOTE: do NOT set spring.jackson.serialization.write-dates-as-timestamps here.
# Spring Boot 4 uses Jackson 3, where that flag was moved out of
# SerializationFeature (to DateTimeFeature) and would fail property binding at
# startup. Jackson 3 already writes java.time values as ISO-8601 strings.

# Associations are fetched eagerly and DTO mapping happens inside the service
# layer, so the session can be closed as soon as the transaction ends.
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# Redis — cache + rate limiter
# ---------------------------------------------------------------------------
# Redis is used for (1) the Spring Cache abstraction and (2) rate limiting.
# It is NOT the JobRunr job store: JobRunr OSS only ships SQL/NoSQL-in-memory
# storage providers, so jobs stay in PostgreSQL (see the section below).
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s

# Lettuce pool (requires commons-pool2, declared in pom.xml).
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-wait=1s

# A custom RedisCacheManager is contributed by CacheConfig; this selects Redis
# as the cache type so the intent is explicit in configuration as well.
spring.cache.type=redis

# Rate limiting for /api/** (see RateLimitProperties).
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.requests-per-window=${RATE_LIMIT_REQUESTS:120}
app.rate-limit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS:60}
# Honour X-Forwarded-For when the app runs behind a reverse proxy / load balancer.
app.rate-limit.trust-forwarded-for=true

# ---------------------------------------------------------------------------
# Messaging / background jobs (JobRunr)
# ---------------------------------------------------------------------------
# JobRunr is the message broker and keeps its jobs in the SAME PostgreSQL
# database as the domain data (JobRunr OSS has no Redis storage provider).
#
# Database storage: reuse the application datasource. JobRunr creates its own
# `jobrunr_jobs` / `jobrunr_recurring_jobs` tables on first start.
jobrunr.database.skip-create=false
jobrunr.database.table-prefix=jobrunr_

# Retry policy: a failing consumer is retried with exponential back-off.
jobrunr.jobs.default-number-of-retries=5
jobrunr.jobs.retry-back-off-time-seed=3

# Job retention: keep successful jobs for a day, failures for a week.
jobrunr.jobs.delete-succeeded-jobs-after=36h
jobrunr.jobs.permanently-delete-deleted-jobs-after=168h

# Enable the JobRunr dashboard on http://localhost:8000/dashboard
# (no authentication is configured, in line with the rest of this application).
jobrunr.dashboard.enabled=true
jobrunr.dashboard.port=8000

# Background worker pool. Enabled so this single process both produces and
# consumes messages; increase the worker count to process more jobs in parallel.
jobrunr.background-job-server.enabled=true
jobrunr.background-job-server.poll-interval-in-seconds=15
jobrunr.background-job-server.worker-count=4

# Where the frontend "Background Jobs" console links for the raw dashboard.
app.messaging.dashboard-url=http://localhost:8000/dashboard
