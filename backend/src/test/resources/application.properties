# ---------------------------------------------------------------------------
# Test configuration
# ---------------------------------------------------------------------------
# This file shadows src/main/resources/application.properties on the test
# classpath (test-classes comes first), so tests never touch the developer's
# PostgreSQL/Redis instances.
#
# In-memory H2 keeps the context test hermetic. MODE=PostgreSQL makes H2 accept
# the PostgreSQL-flavoured SQL Hibernate generates, and the dialect is set
# explicitly because the main configuration pins PostgreSQLDialect.
spring.datasource.url=jdbc:h2:mem:ims-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# JobRunr
# ---------------------------------------------------------------------------
# JobRunr still needs a StorageProvider (it creates its own tables in H2), but
# the worker pool and the dashboard must stay off: a test JVM should not start
# background threads that poll for jobs or bind port 8000.
jobrunr.database.skip-create=false
jobrunr.background-job-server.enabled=false
jobrunr.dashboard.enabled=false
jobrunr.job-scheduler.enabled=true

# ---------------------------------------------------------------------------
# Redis
# ---------------------------------------------------------------------------
# Caching and rate limiting are unit-tested with mocks; disabling the limiter
# keeps any context-level request from depending on a live Redis.
#
# spring.cache.type is kept identical to the main configuration so cache-manager
# selection is explicit rather than inferred from the classpath. Nothing connects
# to Redis at startup: the Lettuce factory and RedisCacheManager are lazy.
spring.cache.type=redis
app.rate-limit.enabled=false
app.messaging.dashboard-url=http://localhost:8000/dashboard
